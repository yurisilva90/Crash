<!doctype html>
<html lang="pt-BR"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup do cabeçalho</title>
<style>body{margin:0;background:#071426;color:#e9f2ff;font:16px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.panel{width:min(92vw,760px);background:#0d2138;border:1px solid #254564;border-radius:22px;padding:24px;box-sizing:border-box}.title{letter-spacing:2px;color:#d5e4f2;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px}.label{color:#94abc1;font-size:13px;margin-bottom:8px}.value{height:58px;background:#081727;border:1px solid #2c4e6d;border-radius:11px;display:grid;place-items:center;font-size:30px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.mode{padding:7px 0;text-align:center;border:1px solid #36516d;border-radius:8px;color:#9eb2c5}.selected{background:#174335;color:#55e0a5;border-color:#35d795;box-shadow:0 0 0 1px #35d795 inset}.legend{margin-top:22px;padding-top:16px;border-top:1px solid #24425f;color:#9eb2c5;display:flex;gap:26px;flex-wrap:wrap}.applied{margin-top:16px;color:#55e0a5;font-size:21px;font-weight:bold}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.rounds{grid-column:1/-1}}</style>
